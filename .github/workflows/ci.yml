name: PHP platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, openssl, mbstring, curl, gd, sodium, exif
          coverage: none
      - run: php scripts/check.php
      - run: php test/run.php
      - run: php test/integrations.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # Screenshots, synthetic databases, password files and keys are never uploaded.
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: alpha_school_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      TEST_MYSQL_URL: mysql://root:ci-only-root-password@127.0.0.1:3306/alpha_school_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, openssl, mbstring, curl, gd, sodium, exif
          coverage: none
      - run: php test/run.php
      - run: php test/integrations.php
