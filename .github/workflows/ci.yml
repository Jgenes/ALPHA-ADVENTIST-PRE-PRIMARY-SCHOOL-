name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # Screenshots, temporary databases and secrets deliberately are not uploaded.
  mysql:
    # The production store on a throwaway MySQL 8 server: schema and indexes, rollback,
    # optimistic conflicts, audit triggers and chain, the retention job, sign-in and the
    # portal API. See test/mysql-store.test.js; it skips locally without MYSQL_URL.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: adsp_ci_placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      MYSQL_URL: mysql://root:ci-only-root-password@127.0.0.1:3306/adsp_ci_placeholder
      MYSQL_SSL_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:mysql
