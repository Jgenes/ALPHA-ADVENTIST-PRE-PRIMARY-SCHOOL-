name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A disposable MySQL 8 database exercises the cPanel storage engine. The
    # database name ends in _test so the rehearsal can never point at school data.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-password
          MYSQL_DATABASE: alpha_school_test
          MYSQL_USER: alpha_school
          MYSQL_PASSWORD: synthetic-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Real MySQL/MariaDB store rehearsal
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: alpha_school_test
          TEST_DB_USER: alpha_school
          TEST_DB_PASSWORD: synthetic-db-password
        run: npm run test:mysql
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # Screenshots, temporary databases and secrets deliberately are not uploaded.
