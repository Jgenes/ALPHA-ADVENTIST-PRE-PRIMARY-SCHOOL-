services:
  - type: web
    name: alpha-adventist-school
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev && node --check server.js && node --check src/lib.js
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://alpha-adventist-pre-primary-school.onrender.com
      - key: ADMIN_PASSWORD
      - key: OFFICE_ALERT_WEBHOOK_URL
        sync: false
      - key: FORM_RETENTION_DAYS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: OFFICE_ALERT_WEBHOOK_URL
        sync: false
    disk:
      name: alpha-school-data
      mountPath: /var/data
      sizeGB: 1
