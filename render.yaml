services:
  - type: web
    name: alpha-adventist-school
    runtime: node
    plan: starter
    buildCommand: node --check server.js && node --check src/lib.js
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        value: https://alphaadventist.ac.tz
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: alpha-school-data
      mountPath: /var/data
      sizeGB: 1
