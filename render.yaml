# PHP/Apache container. Complete institutional release gates before deployment.
services:
  - type: web
    name: alpha-adventist-school
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /readyz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_DB_NAME
        value: alpha_school
      - key: STORAGE_DRIVER
        value: local
      - key: MYSQL_SSL_MODE
        value: verify-full
      - key: MYSQL_SSL_CA
        sync: false
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Alpha School
      - key: OFFICE_ALERT_EMAIL
        sync: false
      - key: PRIVACY_ALERT_EMAIL
        sync: false
      - key: FORM_RETENTION_DAYS
        sync: false
      - key: ADMISSION_RETENTION_DAYS
        sync: false
      - key: RETENTION_POLICY_APPROVED
        sync: false
      - key: HEAD_TEACHER_USERNAME
        sync: false
      - key: HEAD_TEACHER_NAME
        sync: false
      - key: HEAD_TEACHER_PASSWORD
        sync: false
      - key: HEAD_TEACHER_APPROVED
        sync: false
      - key: HEAD_TEACHER_APPROVAL_REFERENCE
        sync: false
    disk:
      name: alpha-school-private-files
      mountPath: /var/data
      sizeGB: 5
